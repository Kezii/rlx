[package]
name = "rlx-nemo"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
description = "RLX — native loader for NVIDIA NeMo `.nemo` model files (tar + torch.save ckpt + YAML config)."
authors.workspace      = true
license.workspace      = true
readme                 = "README.md"
keywords.workspace     = true
categories.workspace   = true
repository.workspace   = true
documentation.workspace = true

[dependencies]
anyhow     = "1"
serde_yaml = "0.9"
rlx-ir = { workspace = true }
# The `torch.save` container itself (ZIP + pickle + dtype decode); `.nemo` is
# that checkpoint plus a tar + YAML wrapper.
rlx-torch-ckpt = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args   = ["--cfg", "docsrs"]
all-features   = false
