[package]
name = "rlx-hub"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
description = "RLX — HuggingFace shard-aware download + verification: safetensors index parsing, layer→shard planning for distributed loads, resumable fetch, and integrity checks."
authors.workspace       = true
license.workspace       = true
keywords.workspace      = true
categories.workspace    = true
repository.workspace    = true
documentation.workspace = true
readme                  = "README.md"

[dependencies]
serde_json = "1"
sha2       = "0.10"
thiserror  = "2"

[dev-dependencies]
anyhow     = "1"  # `examples/shard_download.rs` only — not part of the lib API.

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args   = ["--cfg", "docsrs"]
all-features   = false
